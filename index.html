<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Computer Science Portal</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header-content">
          <div class="header-text">
            <h1 id="course-title">Computer Science</h1>
            <p id="course-info">Loading course information...</p>
            <p id="course-description" class="course-desc">Access your assignments and course materials below.</p>
          </div>
          <div class="header-mascot">
            <img src="assets/images/codercat.jpg" alt="Codercat" class="octocat-mascot" />
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <div class="portal-layout">
          <!-- Main Content Area -->
          <div class="portal-main">
            <!-- Suggested Assignment Section -->
            <section class="next-due-section">
              <h2><span class="highlight-text">⏱️</span> Suggested Next Assignment</h2>
              <div id="next-due-assignment" class="next-due-card">
                <div class="loading">Loading suggested assignment...</div>
              </div>
            </section>

            <!-- Focused Assignments Section -->
            <section class="assignments">
              <div class="assignments-header-with-toggle">
                <h2>Your Assignments</h2>
                <button class="btn btn-sidebar-toggle" onclick="window.portalInstance.toggleSidebar()" aria-label="Show all assignments">
                  📚 View All (18)
                </button>
              </div>
              <div id="assignments-list" class="assignments-list">
                <!-- Assignments will be loaded dynamically -->
                <div class="loading">Loading assignments...</div>
              </div>
            </section>
          </div>

          <!-- Sidebar with All Assignments -->
          <aside id="assignments-sidebar" class="assignments-sidebar">
            <!-- Sidebar content will be loaded dynamically -->
            <div class="loading">Loading sidebar...</div>
          </aside>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <p>&copy; 2025 Computer Science Portal</p>
          <div class="footer-octocat">
            <img src="assets/images/codercat.jpg" alt="Footer Codercat" class="footer-mascot" />
          </div>
        </div>
      </div>
    </footer>

    <script src="assets/js/script.js"></script>
  </body>
</html>
